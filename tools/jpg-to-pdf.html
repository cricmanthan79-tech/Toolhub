<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JPG to PDF - ToolHub</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
text-align:center;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
color:#2563eb;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
cursor:pointer;
font-size:16px;
margin-top:15px;
}

button:hover{
opacity:.9;
}

#downloadBtn{
display:none;
}

#status{
margin-top:15px;
font-weight:bold;
}

</style>

</head>

<body>
<div style="display:flex;justify-content:space-between;align-items:center;padding:15px;">

<a href="../index.html">
<button>🏠 Home</button>
</a>

<button onclick="history.back()">⬅ Back</button>

</div>
<div class="container">

<h1>📄 JPG to PDF</h1>

<p>Select images and convert them into PDF</p>

<input type="file" id="images" accept="image/*" multiple>

<br>

<button onclick="createPDF()">Create PDF</button>

<p id="status"></p>

<a id="downloadBtn">
<button>Download PDF</button>
</a>

</div>


<script>

async function createPDF(){

const files=document.getElementById("images").files;

if(files.length===0){
alert("Please select image");
return;
}


const { jsPDF } = window.jspdf;

const pdf=new jsPDF();


for(let i=0;i<files.length;i++){

const file=files[i];

const dataUrl=await new Promise((resolve)=>{

const reader=new FileReader();

reader.onload=e=>resolve(e.target.result);

reader.readAsDataURL(file);

});


if(i>0){
pdf.addPage();
}


pdf.addImage(dataUrl,"JPEG",10,10,190,0);

}


const pdfBlob=pdf.output("blob");

const pdfUrl=URL.createObjectURL(pdfBlob);


const download=document.getElementById("downloadBtn");

download.href=pdfUrl;

download.download="ToolHub-JPG-to-PDF.pdf";

download.style.display="inline-block";


document.getElementById("status").innerText="✅ PDF Created Successfully";


}

</script>


</body>
</html>
