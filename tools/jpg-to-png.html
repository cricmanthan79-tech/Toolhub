<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JPG to PNG - ToolHub</title>
<link rel="stylesheet" href="../css/style.css">
<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fb;
text-align:center;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
color:#2563eb;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
cursor:pointer;
font-size:16px;
margin-top:15px;
}

img{
max-width:100%;
margin-top:20px;
border-radius:8px;
}

#download{
display:none;
}
</style>
</head>

<body>
<div style="display:flex;justify-content:space-between;align-items:center;padding:15px;">

<a href="../index.html">
<button>🏠 Home</button>
</a>

<button onclick="history.back()">⬅ Back</button>

</div>
<div class="container">

<h1>🖼️ JPG to PNG</h1>

<p>Convert JPG image into PNG format</p>

<input type="file" id="upload" accept="image/jpeg,image/jpg">

<br>

<button onclick="convertImage()">Convert to PNG</button>

<br>

<img id="preview" style="display:none;">

<br>

<a id="download">
<button>Download PNG</button>
</a>

</div>

<script>

function convertImage(){
  const file = document.getElementById("upload").files[0];

if(!file){
alert("Please select JPG image");
return;
}

const reader = new FileReader();

reader.onload = function(e){

const img = new Image();

img.onload = function(){

const canvas = document.createElement("canvas");

canvas.width = img.width;
canvas.height = img.height;

const ctx = canvas.getContext("2d");

ctx.drawImage(img,0,0);

const png = canvas.toDataURL("image/png");

const preview = document.getElementById("preview");
preview.src = png;
preview.style.display = "block";

const download = document.getElementById("download");
download.href = png;
download.download = "ToolHub-JPG-to-PNG.png";
download.style.display = "inline-block";

}

img.src = e.target.result;

}

reader.readAsDataURL(file);
  }
</script>

</body>
</html>
