<h1>🖼️ JPG to PNG</h1>

<p>Convert JPG image into PNG format</p>

<input type="file" id="upload" accept="image/jpeg,image/jpg">

<br>

<button onclick="convertImage()">Convert to PNG</button>

<br>

<img id="preview" style="display:none;">

<br>

<a id="download">
<button>Download PNG</button>
</a>

</div>

<script>

function convertImage(){
  const file = document.getElementById("upload").files[0];

if(!file){
alert("Please select JPG image");
return;
}

const reader = new FileReader();

reader.onload = function(e){

const img = new Image();

img.onload = function(){

const canvas = document.createElement("canvas");

canvas.width = img.width;
canvas.height = img.height;

const ctx = canvas.getContext("2d");

ctx.drawImage(img,0,0);

const png = canvas.toDataURL("image/png");

const preview = document.getElementById("preview");
preview.src = png;
preview.style.display = "block";

const download = document.getElementById("download");
download.href = png;
download.download = "ToolHub-JPG-to-PNG.png";
download.style.display = "inline-block";

}

img.src = e.target.result;

}

reader.readAsDataURL(file);
  }
</script>
