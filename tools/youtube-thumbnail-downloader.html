  <script>

function getThumbnail(){

const url=document.getElementById("url").value.trim();

const error=document.getElementById("error");
const result=document.getElementById("result");

error.innerHTML="";
result.style.display="none";

let id="";

if(url.includes("youtu.be/")){
id=url.split("youtu.be/")[1].split("?")[0];
}
else if(url.includes("watch?v=")){
id=url.split("watch?v=")[1].split("&")[0];
}
else if(url.includes("/shorts/")){
id=url.split("/shorts/")[1].split("?")[0];
}
else{
error.innerHTML="❌ Invalid YouTube URL";
return;
}

const max="https://img.youtube.com/vi/"+id+"/maxresdefault.jpg";
const hq="https://img.youtube.com/vi/"+id+"/hqdefault.jpg";
const mq="https://img.youtube.com/vi/"+id+"/mqdefault.jpg";
const sd="https://img.youtube.com/vi/"+id+"/sddefault.jpg";

document.getElementById("thumb").src=max;

document.getElementById("max").href=max;
document.getElementById("max").download="YouTube-HD-Thumbnail.jpg";

document.getElementById("hq").href=hq;
document.getElementById("hq").download="YouTube-HQ-Thumbnail.jpg";

document.getElementById("mq").href=mq;
document.getElementById("mq").download="YouTube-MQ-Thumbnail.jpg";

document.getElementById("sd").href=sd;
document.getElementById("sd").download="YouTube-SD-Thumbnail.jpg";

result.style.display="block";

}

</script>
