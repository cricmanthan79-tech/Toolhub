<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Age Calculator - ToolHub</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
padding:20px;
text-align:center;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
color:#2563eb;
}

input{
padding:12px;
font-size:16px;
border:1px solid #ddd;
border-radius:8px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:15px;
}

.result{
margin-top:20px;
font-size:18px;
line-height:1.8;
}

</style>

</head>


<body>


<div class="container">

<h1>🎂 Age Calculator</h1>

<p>Calculate your exact age</p>


<input type="date" id="dob">
<br><br>

<label>Calculate age till:</label>

<br>

<input type="date" id="targetDate">
<br>

<button onclick="calculateAge()">
Calculate Age
</button>


<div class="result" id="result"></div>


</div>



<script>


function calculateAge(){


let dob=document.getElementById("dob").value;


if(!dob){

alert("Please select date of birth");

return;

}


let birthDate=new Date(dob);

let target=document.getElementById("targetDate").value;

let today = target ? new Date(target) : new Date();


let years=today.getFullYear()-birthDate.getFullYear();

let months=today.getMonth()-birthDate.getMonth();

let days=today.getDate()-birthDate.getDate();



if(days<0){

months--;

let previousMonth=new Date(
today.getFullYear(),
today.getMonth(),
0
);

days+=previousMonth.getDate();

}



if(months<0){

years--;

months+=12;

}



document.getElementById("result").innerHTML=

`
<h3>🎉 Your Age</h3>

${years} Years  
<br>
${months} Months  
<br>
${days} Days

`;

}


</script>


</body>
</html>
