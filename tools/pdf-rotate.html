<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Rotate - ToolHub</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fb;
padding:20px;
text-align:center;
}

.container{
max-width:600px;
margin:auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
color:#2563eb;
}

select,input{
width:90%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
background:#2563eb;
color:#fff;
border:none;
padding:12px 24px;
border-radius:8px;
cursor:pointer;
margin-top:15px;
font-size:16px;
}

#download{
display:none;
}
</style>
</head>

<body>
<div style="display:flex;justify-content:space-between;align-items:center;padding:15px;">

<a href="../index.html">
<button>🏠 Home</button>
</a>

<button onclick="history.back()">⬅ Back</button>

</div>
<div class="container">

<h1>🔄 PDF Rotate</h1>

<p>Select a PDF and rotate all pages.</p>

<input type="file" id="pdfFile" accept="application/pdf">

<select id="rotation">
<option value="90">Rotate 90°</option>
<option value="180">Rotate 180°</option>
<option value="270">Rotate 270°</option>
</select>

<button onclick="rotatePDF()">Rotate PDF</button>

<p id="status"></p>

<a id="download">
<button>Download Rotated PDF</button>
</a>

</div>

<script>
async function rotatePDF(){
  const file = document.getElementById("pdfFile").files[0];

if(!file){
alert("Please select a PDF");
return;
}

const angle = parseInt(document.getElementById("rotation").value);

const bytes = await file.arrayBuffer();

const pdfDoc = await PDFLib.PDFDocument.load(bytes);

const pages = pdfDoc.getPages();

pages.forEach(page => {
page.setRotation(PDFLib.degrees(angle));
});

const pdfBytes = await pdfDoc.save();

const blob = new Blob(
[pdfBytes],
{type:"application/pdf"}
);

const url = URL.createObjectURL(blob);

const download = document.getElementById("download");

download.href = url;
download.download = "ToolHub-Rotated-PDF.pdf";
download.style.display = "inline-block";

document.getElementById("status").innerText =
"✅ PDF Rotated Successfully";
}
</script>

</body>
</html>
