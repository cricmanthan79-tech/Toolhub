<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Split - ToolHub</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fb;
margin:0;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
text-align:center;
}

h1{
color:#2563eb;
margin-bottom:10px;
}

p{
color:#555;
}

input{
width:90%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
background:#2563eb;
color:#fff;
border:none;
padding:12px 24px;
border-radius:8px;
cursor:pointer;
font-size:16px;
margin-top:15px;
}

button:hover{
background:#1d4ed8;
}

#download{
display:none;
margin-top:20px;
}

#pageInfo{
font-weight:bold;
color:#16a34a;
margin:10px 0;
}

#status{
font-weight:bold;
margin-top:15px;
}
</style>
</head>

<body>
<div style="display:flex;justify-content:space-between;align-items:center;padding:15px;">

<a href="../index.html">
<button>🏠 Home</button>
</a>

<button onclick="history.back()">⬅ Back</button>

</div>
<div class="container">

<h1>📄 PDF Split</h1>

<p>Select a PDF and split a single page or page range.</p>

<input type="file" id="pdfFile" accept="application/pdf">

<p id="pageInfo">Total Pages: -</p>

<input type="number" id="startPage" placeholder="Start Page">

<input type="number" id="endPage" placeholder="End Page">

<button onclick="splitPDF()">Split PDF</button>

<p id="status"></p>

<a id="download">
<button>Download Split PDF</button>
</a>

</div>

<script>

let totalPages=0;

document.getElementById("pdfFile").addEventListener("change",async function(){

const file=this.files[0];

if(!file)return;
  const bytes = await file.arrayBuffer();

const pdf = await PDFLib.PDFDocument.load(bytes);

totalPages = pdf.getPageCount();

document.getElementById("pageInfo").innerText =
"Total Pages: " + totalPages;

});

async function splitPDF(){

const file = document.getElementById("pdfFile").files[0];

if(!file){
alert("Please select a PDF");
return;
}

const start = parseInt(document.getElementById("startPage").value);
const end = parseInt(document.getElementById("endPage").value);

if(
isNaN(start) ||
isNaN(end) ||
start < 1 ||
end > totalPages ||
start > end
){
alert("Enter a valid page range.");
return;
}

const bytes = await file.arrayBuffer();

const sourcePdf = await PDFLib.PDFDocument.load(bytes);

const newPdf = await PDFLib.PDFDocument.create();
  for(let i = start; i <= end; i++){

const [page] = await newPdf.copyPages(
sourcePdf,
[i-1]
);

newPdf.addPage(page);

}

const pdfBytes = await newPdf.save();

const blob = new Blob(
[pdfBytes],
{type:"application/pdf"}
);

const url = URL.createObjectURL(blob);

const download = document.getElementById("download");

download.href = url;
download.download = "ToolHub-Split-" + start + "-to-" + end + ".pdf";

download.style.display = "inline-block";

document.getElementById("status").innerText =
"✅ PDF Split Successfully (" + start + " - " + end + ")";
  }
</script>

</body>
</html>
