<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF to JPG - ToolHub</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fb;
padding:20px;
text-align:center;
}

.container{
max-width:750px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
color:#2563eb;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 22px;
border-radius:8px;
cursor:pointer;
margin:10px;
font-size:16px;
}

select,input{
padding:10px;
margin:10px;
}

.progress{
width:100%;
background:#ddd;
height:20px;
border-radius:10px;
overflow:hidden;
margin-top:20px;
}

#bar{
height:100%;
width:0%;
background:#2563eb;
}

.preview img{
width:180px;
margin:10px;
border:1px solid #ddd;
border-radius:8px;
}

#downloadZip{
display:none;
}
</style>

</head>

<body>
<div style="display:flex;justify-content:space-between;align-items:center;padding:15px;">

<a href="../index.html">
<button>🏠 Home</button>
</a>

<button onclick="history.back()">⬅ Back</button>

</div>
<div class="container">

<h1>🖼️ PDF to JPG</h1>

<p>Convert all PDF pages into JPG images</p>

<input type="file" id="pdfFile" accept="application/pdf">

<br>

<select id="quality">
<option value="1.5">Low Quality</option>
<option value="2" selected>Medium Quality</option>
<option value="3">HD Quality</option>
</select>

<br>

<button onclick="convertPDF()">Convert PDF</button>

<div class="progress">
<div id="bar"></div>
</div>

<p id="status"></p>

<div class="preview" id="preview"></div>

<a id="downloadZip">
<button>Download ZIP</button>
</a>

</div>


<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


let images=[];


async function convertPDF(){

const file=document.getElementById("pdfFile").files[0];

if(!file){
alert("Please select PDF");
return;
}


images=[];

document.getElementById("preview").innerHTML="";
document.getElementById("downloadZip").style.display="none";


const quality=parseFloat(
document.getElementById("quality").value
);


const data=await file.arrayBuffer();

const pdf=await pdfjsLib.getDocument({data:data}).promise;


const total=pdf.numPages;


for(let i=1;i<=total;i++){


document.getElementById("status").innerText=
"Converting page "+i+" of "+total;


const page=await pdf.getPage(i);


const viewport=page.getViewport({
scale:quality
});


const canvas=document.createElement("canvas");

const ctx=canvas.getContext("2d");


canvas.width=viewport.width;
canvas.height=viewport.height;


await page.render({
canvasContext:ctx,
viewport:viewport
}).promise;



const jpg=canvas.toDataURL(
"image/jpeg",
0.95
);


images.push(jpg);

canvas.width=1;
canvas.height=1;


let box=document.createElement("div");

let img=document.createElement("img");
img.src=jpg;
  
let pageText=document.createElement("p");
pageText.innerText="Page "+i;
pageText.style.fontWeight="bold";

box.appendChild(pageText);

img.style.cursor="pointer";

img.onclick=function(){

let newWindow = window.open();

newWindow.document.write(
`
<html>
<head>
<style>
body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:auto;
}

img{
max-width:100%;
max-height:100vh;
object-fit:contain;
}
</style>
</head>

<body>
<img src="${jpg}">
</body>
</html>
`
);

};


let downloadBtn=document.createElement("button");

downloadBtn.innerText="Download JPG";

downloadBtn.onclick=function(){

let a=document.createElement("a");
a.href=jpg;
a.download="ToolHub-Page-"+i+".jpg";
a.click();

};


box.appendChild(img);
box.appendChild(downloadBtn);


document.getElementById("preview")
.appendChild(box);


let percent=(i/total)*100;

document.getElementById("bar")
.style.width=percent+"%";


}



document.getElementById("status").innerText=
"✅ All pages converted";


createZip();

}



async function createZip(){

const zip=new JSZip();


images.forEach((img,index)=>{

let data=img.split(",")[1];

zip.file(
"ToolHub_Page_"+(index+1)+".jpg",
data,
{base64:true}
);

});


const content=await zip.generateAsync({
type:"blob"
});


const link=document.getElementById("downloadZip");

link.href=URL.createObjectURL(content);

link.download="ToolHub-PDF-to-JPG.zip";

link.style.display="inline-block";


}

</script>

</body>
</html>
