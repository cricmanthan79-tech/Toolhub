<div class="container">

<h1>🖼️ Image Watermark</h1>

<input type="file" id="imageInput" accept="image/*">

<br>

<input type="file" id="logoInput" accept="image/*" hidden>

<label for="logoInput" class="uploadBtn">
📷 Upload Logo
</label>


<input type="text" id="watermarkText" placeholder="Enter Watermark Text">


<label>Logo Size</label>
<input type="range" id="logoSize" min="50" max="400" value="150">


<label>Logo Position</label>
<select id="logoPosition">
<option value="top-left">Top Left</option>
<option value="top-right">Top Right</option>
<option value="center">Center</option>
<option value="bottom-left">Bottom Left</option>
<option value="bottom-right" selected>Bottom Right</option>
</select>


<label>Text Color</label>
<input type="color" id="textColor" value="#ffffff">
Watermark Position

↓
Text Color  🎨

↓
Font Size

↓
Opacity

<label>Font Size</label>
<input type="range" id="fontSize" min="20" max="120" value="40">


<label>Opacity</label>
<input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.5">


<label>Watermark Position</label>
<select id="position">
<option value="top-left">Top Left</option>
<option value="top-right">Top Right</option>
<option value="center" selected>Center</option>
<option value="bottom-left">Bottom Left</option>
<option value="bottom-right">Bottom Right</option>
</select>


<label>Download Format</label>
<select id="downloadFormat">
<option value="png">PNG</option>
<option value="jpeg">JPG</option>
</select>


<button onclick="applyWatermark()">
Apply Watermark
</button>

<br>

<canvas id="canvas"></canvas>

<br>

<a id="download" style="display:none">
<button>Download Image</button>
</a>

<script>

const imageInput=document.getElementById("imageInput");
const logoInput=document.getElementById("logoInput");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let img=new Image();
let logo=new Image();
let logoLoaded=false;


imageInput.onchange=function(e){

let file=e.target.files[0];

if(!file)return;

img.onload=function(){

canvas.width=img.width;
canvas.height=img.height;

applyWatermark();

}

img.src=URL.createObjectURL(file);

};



logoInput.onchange=function(e){

let file=e.target.files[0];

if(!file)return;

logo.onload=function(){

logoLoaded=true;
applyWatermark();

}

logo.src=URL.createObjectURL(file);

};



// Live Preview

document.querySelectorAll("input,select").forEach(item=>{

item.addEventListener("input",applyWatermark);
item.addEventListener("change",applyWatermark);

});



function applyWatermark(){


if(!img.src) return;


ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.drawImage(img,0,0);



let opacity=parseFloat(
document.getElementById("opacity").value
);


let text=document.getElementById("watermarkText").value;

let fontSize=parseInt(
document.getElementById("fontSize").value
);


let color=document.getElementById("textColor").value;


let position=document.getElementById("position").value;


ctx.globalAlpha=opacity;

ctx.font=fontSize+"px Arial";

ctx.fillStyle=color;


let x=20;
let y=50;


switch(position){

case "top-right":
x=canvas.width-ctx.measureText(text).width-20;
break;


case "center":
x=(canvas.width-ctx.measureText(text).width)/2;
y=canvas.height/2;
break;


case "bottom-left":
x=20;
y=canvas.height-30;
break;


case "bottom-right":
x=canvas.width-ctx.measureText(text).width-20;
y=canvas.height-30;
break;

}


ctx.fillText(text,x,y);
ctx.globalAlpha = 1;


if(logoLoaded){


let size=parseInt(
document.getElementById("logoSize").value
);


let logoPosition=
document.getElementById("logoPosition").value;



let lx=20;
let ly=20;



switch(logoPosition){


case "top-right":
lx=canvas.width-size-20;
break;


case "center":
lx=(canvas.width-size)/2;
ly=(canvas.height-size)/2;
break;


case "bottom-left":
ly=canvas.height-size-20;
break;


case "bottom-right":
lx=canvas.width-size-20;
ly=canvas.height-size-20;
break;


}


ctx.drawImage(
logo,
lx,
ly,
size,
size
);


}


ctx.globalAlpha=1;



let link=document.getElementById("download");

let format=document.getElementById("downloadFormat").value;


link.href=canvas.toDataURL(
"image/"+format,
0.95
);


link.download=
"ToolHub-Watermark."+format;


link.style.display="inline-block";


}


</script>
