<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Watermark - ToolHub</title>




<style>

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
padding:20px;
text-align:center;
}
canvas{
max-width:100%;
margin-top:20px;
border:1px solid #ddd;
}

.uploadBtn{
display:inline-block;
background:#2563eb;
color:#fff;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
margin:10px 0;
font-size:16px;
}
  .uploadBtn:hover{
background:#1d4ed8;
}

.container{
max-width:800px;
margin:auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input,select{
padding:10px;
margin:10px;
width:90%;
max-width:350px;
}

button{
background:#2563eb;
color:#fff;
border:none;
padding:12px 24px;
border-radius:8px;
cursor:pointer;
margin:10px;
}

canvas{
max-width:100%;
margin-top:20px;
border:1px solid #ddd;
}

</style>
</head>

<body>

<div class="container">

<h1>🖼️ Image Watermark</h1>

<input type="file" id="imageInput" accept="image/*">
<br>
<input type="file" id="logoInput" accept="image/png,image/jpeg,image/webp" hidden>

<label for="logoInput" class="uploadBtn">
📷 Upload Logo
</label>

<br>

<input type="text" id="watermarkText" placeholder="Enter Watermark Text">

<br>

<label>Font Size</label><br>
<input type="range" id="fontSize" min="20" max="100" value="40">

<br>

<label>Opacity</label><br>
<input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.5">

<br>
<label>Watermark Position</label><br>
<select id="position">
<option value="top-left">Top Left</option>
<option value="top-right">Top Right</option>
<option value="center" selected>Center</option>
<option value="bottom-left">Bottom Left</option>
<option value="bottom-right">Bottom Right</option>
</select>

<br>

<label>Download Format</label><br>

<select id="downloadFormat">
<option value="png">PNG</option>
<option value="jpeg">JPG</option>
</select>

<button onclick="applyWatermark()">
Apply Watermark
</button>

<br>

<canvas id="canvas"></canvas>

<br>

<a id="download" style="display:none;">
<button>Download Image</button>
</a>

</div>
  <script>

const imageInput=document.getElementById("imageInput");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let img=new Image();
    let logo=new Image();
let logoLoaded=false;

document.getElementById("logoInput").onchange=function(e){

const file=e.target.files[0];

if(!file)return;

logo.onload=function(){
logoLoaded=true;
};

logo.src=URL.createObjectURL(file);

};

imageInput.onchange=function(e){

const file=e.target.files[0];

if(!file)return;

img.onload=function(){

canvas.width=img.width;
canvas.height=img.height;

ctx.drawImage(img,0,0);

};

img.src=URL.createObjectURL(file);

};

function applyWatermark(){

if(!img.src){

alert("Please upload an image");

return;

}

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.drawImage(img,0,0);

const text=document.getElementById("watermarkText").value;

const size=parseInt(document.getElementById("fontSize").value);

const opacity=parseFloat(document.getElementById("opacity").value);

const position=document.getElementById("position").value;

ctx.font=size+"px Arial";

ctx.fillStyle="rgba(255,255,255,"+opacity+")";

let x=20;
let y=50;

switch(position){

case "top-right":
x=canvas.width-ctx.measureText(text).width-20;
y=50;
break;

case "center":
x=(canvas.width-ctx.measureText(text).width)/2;
y=canvas.height/2;
break;

case "bottom-left":
x=20;
y=canvas.height-30;
break;

case "bottom-right":
x=canvas.width-ctx.measureText(text).width-20;
y=canvas.height-30;
break;

}

ctx.fillText(text,x,y);

const link=document.getElementById("download");

const format=document.getElementById("downloadFormat").value;

link.href=canvas.toDataURL("image/"+format,0.95);

link.download="ToolHub-Watermark."+format;

link.style.display="inline-block";

}

</script>

</body>
</html>
