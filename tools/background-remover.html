<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Background Remover - ToolHub</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fb;
padding:20px;
text-align:center;
}

.container{
max-width:800px;
margin:auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
color:#2563eb;
}

.upload{
border:2px dashed #2563eb;
padding:40px;
border-radius:10px;
margin:20px 0;
cursor:pointer;
}

.upload:hover{
background:#f0f7ff;
}

input{
display:none;
}

img{
max-width:100%;
margin-top:20px;
border-radius:10px;
display:none;
}

button{
background:#2563eb;
color:#fff;
border:none;
padding:12px 24px;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:20px;
}

button:disabled{
background:#999;
cursor:not-allowed;
}

#status{
margin-top:15px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 AI Background Remover</h1>

<label class="upload">
<input type="file" id="imageInput" accept="image/*">
📂 Click to Upload Image
</label>

<img id="preview">

<br>

<button id="removeBtn" disabled>
Remove Background
</button>

<p id="status"></p>

</div>

<script>

const input=document.getElementById("imageInput");
const preview=document.getElementById("preview");
const removeBtn=document.getElementById("removeBtn");

input.addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

preview.src=URL.createObjectURL(file);

preview.style.display="block";

removeBtn.disabled=false;

document.getElementById("status").innerHTML=
"✅ Image Ready";

});

removeBtn.onclick=function(){

document.getElementById("status").innerHTML=
"⏳ AI Model will be added in next step...";

};

</script>

</body>
</html>
