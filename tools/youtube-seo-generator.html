<div class="container">

<div class="top-bar">
<a href="../index.html" class="btn">🏠 Home</a>
<button class="btn" onclick="history.back()">⬅ Back</button>
</div>

<h1>🎥 YouTube SEO Generator</h1>

<p>Create Viral Titles, SEO Description & Tags</p>

<label>Video Topic</label>
<input type="text" id="topic" placeholder="Example: India vs Pakistan Asia Cup 2026">

<label>Language</label>
<select id="language">
<option>Hindi</option>
<option>English</option>
</select>

<label>Style</label>
<select id="style">
<option>Viral</option>
<option>Professional</option>
<option>Clickbait</option>
</select>

<button class="btn" onclick="generateSEO()">
🚀 Generate SEO
</button>

<h2>🏷️ Viral Titles</h2>
<textarea id="titles" rows="6" readonly></textarea>

<h2>📝 Description</h2>
<textarea id="description" rows="8" readonly></textarea>

<h2>#️⃣ Tags</h2>
<textarea id="tags" rows="5" readonly></textarea>

</div>
<script>
function generateSEO(){

const topic = document.getElementById("topic").value.trim();

if(topic===""){
alert("Please enter a video topic.");
return;
}

document.getElementById("titles").value =
`🔥 ${topic}
😱 ${topic} Explained
Top Facts About ${topic}
${topic} Full Analysis
Why ${topic} Is Trending
${topic} Latest Update
Everything About ${topic}
${topic} in Hindi
Big News: ${topic}
Must Watch: ${topic}`;

document.getElementById("description").value =
`In this video we cover ${topic} in detail.

✅ Latest Updates
✅ Important Facts
✅ Complete Analysis

If you enjoyed this video, don't forget to Like, Share and Subscribe for more updates.`;

document.getElementById("tags").value =
`${topic}, ${topic} latest, ${topic} news, ${topic} update, youtube seo, viral video, trending, hindi, latest news`;

}
</script>
