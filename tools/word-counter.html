<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Counter - ToolHub</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
padding:20px;
text-align:center;
}

.container{
max-width:650px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
color:#2563eb;
}

textarea{
width:95%;
height:200px;
padding:15px;
font-size:16px;
border:1px solid #ddd;
border-radius:8px;
resize:none;
}

.stats{
margin-top:20px;
font-size:18px;
line-height:1.8;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
font-size:16px;
margin:8px;
}

</style>

</head>

<body>

<div class="container">

<h1>📝 Word Counter</h1>

<p>Count words, characters and reading time</p>


<textarea id="text" placeholder="Type or paste your text here..."
oninput="countText()"></textarea>


<div class="stats">

<div>Words: <b id="words">0</b></div>

<div>Characters: <b id="chars">0</b></div>

<div>Characters without spaces: <b id="noSpace">0</b></div>

<div>Sentences: <b id="sentences">0</b></div>

<div>Reading Time: <b id="time">0</b> min</div>

</div>


<button onclick="clearText()">
🗑️ Clear
</button>


<button onclick="downloadText()">
📥 Download TXT
</button>


</div>



<script>


function countText(){

let text=document.getElementById("text").value;

let clean=text.trim();


let words=clean ? clean.split(/\s+/).length : 0;


let chars=text.length;


let noSpace=text.replace(/\s/g,"").length;


let sentences=clean ? clean.split(/[.!?]+/).filter(Boolean).length : 0;


let reading=Math.ceil(words/200);


document.getElementById("words").innerText=words;

document.getElementById("chars").innerText=chars;

document.getElementById("noSpace").innerText=noSpace;

document.getElementById("sentences").innerText=sentences;

document.getElementById("time").innerText=reading;


}



function clearText(){

document.getElementById("text").value="";

countText();

}



function downloadText(){

let text=document.getElementById("text").value;


let blob=new Blob([text],{
type:"text/plain"
});


let link=document.createElement("a");

link.href=URL.createObjectURL(blob);

link.download="ToolHub-Text.txt";

link.click();

}


</script>


</body>
</html>
