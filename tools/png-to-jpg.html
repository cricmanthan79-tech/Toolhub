<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PNG to JPG - ToolHub</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
text-align:center;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
color:#2563eb;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
cursor:pointer;
font-size:16px;
margin-top:15px;
}

img{
max-width:100%;
margin-top:20px;
border-radius:8px;
}

#download{
display:none;
}

</style>

</head>


<body>
<div style="display:flex;justify-content:space-between;align-items:center;padding:15px;">

<a href="../index.html">
<button>🏠 Home</button>
</a>

<button onclick="history.back()">⬅ Back</button>

</div>
<div class="container">

<h1>🖼️ PNG to JPG</h1>

<p>Convert PNG image into JPG format</p>

<input type="file" id="upload" accept="image/png">

<br>

<button onclick="convertImage()">Convert to JPG</button>

<br>

<img id="preview" style="display:none;">

<br>

<a id="download">
<button>Download JPG</button>
</a>


</div>


<script>

function convertImage(){

const file=document.getElementById("upload").files[0];

if(!file){
alert("Please select PNG image");
return;
}


const reader=new FileReader();


reader.onload=function(e){

const img=new Image();


img.onload=function(){

const canvas=document.createElement("canvas");

canvas.width=img.width;
canvas.height=img.height;


const ctx=canvas.getContext("2d");

ctx.fillStyle="white";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.drawImage(img,0,0);


const jpg=canvas.toDataURL("image/jpeg",0.9);


const preview=document.getElementById("preview");

preview.src=jpg;
preview.style.display="block";


const download=document.getElementById("download");

download.href=jpg;
download.download="ToolHub-PNG-to-JPG.jpg";
download.style.display="inline-block";


}


img.src=e.target.result;

}


reader.readAsDataURL(file);


}

</script>


</body>

</html>
