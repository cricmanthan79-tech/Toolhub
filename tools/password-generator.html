<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator - ToolHub</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fb;
padding:20px;
text-align:center;
}

.container{
max-width:500px;
margin:auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input[type=text]{
width:100%;
padding:12px;
font-size:18px;
text-align:center;
border:1px solid #ccc;
border-radius:8px;
margin-bottom:15px;
}

input[type=range]{
width:100%;
}

.options{
text-align:left;
margin:20px 0;
}

.options label{
display:block;
margin:8px 0;
}

button{
background:#2563eb;
color:#fff;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
margin:8px;
font-size:16px;
}

#strength{
font-weight:bold;
margin-top:15px;
font-size:18px;
}
</style>

</head>
<body>

<div class="container">

<h1>🔐 Password Generator</h1>

<input type="text" id="password" readonly>

<label>Password Length:
<span id="lengthValue">16</span>
</label>

<input type="range" id="length" min="4" max="64" value="16">

<div class="options">

<label><input type="checkbox" id="upper" checked> Uppercase (A-Z)</label>

<label><input type="checkbox" id="lower" checked> Lowercase (a-z)</label>

<label><input type="checkbox" id="number" checked> Numbers (0-9)</label>

<label><input type="checkbox" id="symbol" checked> Symbols (!@#$)</label>

</div>
<label>Custom Word (Optional)</label>
<input type="text" id="customWord" placeholder="Enter your name">

<label><input type="checkbox" id="addYear"> Add Current Year</label>

<label><input type="checkbox" id="addRandomNumbers" checked> Add Random Numbers</label>

<label><input type="checkbox" id="addSymbols" checked> Add Symbols</label>
<div id="strength">Strength: Strong 🟢</div>

<button onclick="generatePassword()">Generate Password</button>

<button onclick="copyPassword()">Copy Password</button>

</div>

<script>

const length=document.getElementById("length");
const lengthValue=document.getElementById("lengthValue");

length.oninput=()=>{
lengthValue.innerText=length.value;
generatePassword();
};
length.oninput=()=>{
lengthValue.innerText=length.value;
generatePassword();
};

document.getElementById("customWord").addEventListener("input", generatePassword);

document.querySelectorAll("input[type=checkbox]").forEach(item=>{
item.addEventListener("change", generatePassword);
});

function generatePassword(){
function generatePassword(){

let chars="";

if(document.getElementById("upper").checked)
chars+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

if(document.getElementById("lower").checked)
chars+="abcdefghijklmnopqrstuvwxyz";

if(document.getElementById("number").checked)
chars+="0123456789";

if(document.getElementById("symbol").checked)
chars+="!@#$%^&*()_+[]{}<>?/";

if(chars===""){
alert("Select at least one option");
return;
}

let password=document.getElementById("customWord").value;

if(document.getElementById("addYear").checked){
password+=new Date().getFullYear();
}

if(document.getElementById("addRandomNumbers").checked){
password+=Math.floor(Math.random()*9000+1000);
}

if(document.getElementById("addSymbols").checked){
const symbols="!@#$%^&*";
password+=symbols[Math.floor(Math.random()*symbols.length)];
}

while(password.length<length.value){
password+=chars.charAt(Math.floor(Math.random()*chars.length));
}

password=password.substring(0,length.value);

document.getElementById("password").value=password;

let strength="Weak 🔴";

if(length.value>=10) strength="Medium 🟡";
if(length.value>=16 &&
document.getElementById("symbol").checked &&
document.getElementById("number").checked)
strength="Strong 🟢";

document.getElementById("strength").innerText="Strength: "+strength;

}

function copyPassword(){

const pass=document.getElementById("password");

pass.select();

document.execCommand("copy");

alert("Password Copied!");

}

generatePassword();

</script>

</body>
</html>
