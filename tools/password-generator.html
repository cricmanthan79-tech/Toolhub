<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator - ToolHub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
padding:20px;
}

.container{
max-width:550px;
margin:auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin-bottom:20px;
color:#2563eb;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input[type=text]{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

input[type=range]{
width:100%;
margin-top:8px;
}

.options label{
font-weight:normal;
margin-top:8px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#strength{
margin-top:15px;
text-align:center;
font-weight:bold;
font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>🔐 Password Generator</h1>
<input type="text" id="password" readonly placeholder="Your Password">

<label>
Password Length:
<span id="lengthValue">16</span>
</label>

<input type="range" id="length" min="4" max="64" value="16">

<label>Custom Word (Optional)</label>
<input type="text" id="customWord" placeholder="Enter your name">

<div class="options">

<label>
<input type="checkbox" id="upper" checked>
Uppercase (A-Z)
</label>

<label>
<input type="checkbox" id="lower" checked>
Lowercase (a-z)
</label>

<label>
<input type="checkbox" id="number" checked>
Numbers (0-9)
</label>

<label>
<input type="checkbox" id="symbol" checked>
Symbols (!@#$)
</label>

<label>
<input type="checkbox" id="addYear">
Add Current Year
</label>

<label>
<input type="checkbox" id="addRandomNumbers" checked>
Add Random Numbers
</label>

<label>
<input type="checkbox" id="addSymbols" checked>
Add Extra Symbol
</label>

</div>

<div id="strength">
Strength: Strong 🟢
</div>

<button onclick="generatePassword()">
Generate Password
</button>

<button onclick="copyPassword()">
Copy Password
</button>
<script>

const length=document.getElementById("length");
const lengthValue=document.getElementById("lengthValue");

length.addEventListener("input",()=>{
lengthValue.textContent=length.value;
generatePassword();
});

document.getElementById("customWord").addEventListener("input",generatePassword);

document.querySelectorAll("input[type=checkbox]").forEach(item=>{
item.addEventListener("change",generatePassword);
});

function generatePassword(){

let chars="";

if(document.getElementById("upper").checked)
chars+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

if(document.getElementById("lower").checked)
chars+="abcdefghijklmnopqrstuvwxyz";

if(document.getElementById("number").checked)
chars+="0123456789";

if(document.getElementById("symbol").checked)
chars+="!@#$%^&*()_+[]{}<>?/";

if(chars===""){
alert("Please select at least one option.");
return;
}

let password=document.getElementById("customWord").value;

if(document.getElementById("addYear").checked){
password+=new Date().getFullYear();
}

if(document.getElementById("addRandomNumbers").checked){
password+=Math.floor(Math.random()*9000+1000);
}

if(document.getElementById("addSymbols").checked){
const symbols="!@#$%^&*";
password+=symbols[Math.floor(Math.random()*symbols.length)];
}

while(password.length<parseInt(length.value)){
password+=chars.charAt(Math.floor(Math.random()*chars.length));
}

password=password.substring(0,parseInt(length.value));

document.getElementById("password").value=password;

let strength="Weak 🔴";

if(length.value>=10)
strength="Medium 🟡";

if(length.value>=16 &&
document.getElementById("number").checked &&
document.getElementById("symbol").checked){
strength="Strong 🟢";
}

document.getElementById("strength").innerText="Strength: "+strength;

}

function copyPassword(){

const pass=document.getElementById("password").value;

if(pass===""){
alert("Generate a password first.");
return;
}

if(navigator.clipboard){
navigator.clipboard.writeText(pass)
.then(()=>alert("Password Copied!"))
.catch(()=>{
fallbackCopy(pass);
});
}else{
fallbackCopy(pass);
}

}

function fallbackCopy(text){

const temp=document.createElement("textarea");
temp.value=text;
document.body.appendChild(temp);
temp.select();
document.execCommand("copy");
document.body.removeChild(temp);

alert("Password Copied!");

}

generatePassword();

</script>
</div>
  
</body>
</html>
