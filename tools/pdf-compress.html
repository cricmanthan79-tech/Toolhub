<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Compress - ToolHub</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fb;
padding:20px;
text-align:center;
}

.container{
max-width:600px;
margin:auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
color:#2563eb;
}

input,select{
width:90%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
background:#2563eb;
color:#fff;
border:none;
padding:12px 24px;
border-radius:8px;
cursor:pointer;
font-size:16px;
margin-top:15px;
}

#download{
display:none;
}
</style>
</head>

<body>
<div style="display:flex;justify-content:space-between;align-items:center;padding:15px;">

<a href="../index.html">
<button>🏠 Home</button>
</a>

<button onclick="history.back()">⬅ Back</button>

</div>
<div class="container">

<h1>🗜️ PDF Compress</h1>

<p>Optimize your PDF for smaller file size.</p>

<input type="file" id="pdfFile" accept="application/pdf">

<select id="level">
<option value="low">Low Compression</option>
<option value="medium">Medium Compression</option>
<option value="high">High Compression</option>
</select>

<p id="originalSize"></p>

<button onclick="compressPDF()">Compress PDF</button>

<p id="status"></p>

<a id="download">
<button>Download PDF</button>
</a>

</div>

<script>

async function compressPDF(){
  const file = document.getElementById("pdfFile").files[0];

if(!file){
alert("Please select a PDF");
return;
}

document.getElementById("originalSize").innerText =
"Original Size: " + (file.size/1024/1024).toFixed(2) + " MB";

const level = document.getElementById("level").value;

const bytes = await file.arrayBuffer();

const pdfDoc = await PDFLib.PDFDocument.load(bytes);

await pdfDoc.save({
useObjectStreams: true,
addDefaultPage: false,
updateFieldAppearances: false
});

const optimizedBytes = await pdfDoc.save();

const blob = new Blob(
[optimizedBytes],
{type:"application/pdf"}
);

const url = URL.createObjectURL(blob);

const download = document.getElementById("download");

download.href = url;
download.download = "ToolHub-Compressed.pdf";
download.style.display = "inline-block";

document.getElementById("status").innerText =
"✅ PDF optimization completed.";
  }
</script>

</body>
</html>
