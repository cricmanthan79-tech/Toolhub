<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolHub - Free PDF & Image Tools</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#222}
header{
background:#2563eb;
color:#fff;
padding:20px;
text-align:center;
}
header h1{font-size:32px}
header p{margin-top:8px}

nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
background:#fff;
padding:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

nav a{
text-decoration:none;
color:#2563eb;
font-weight:bold;
}

.hero{
padding:50px 20px;
text-align:center;
}

.hero h2{
font-size:34px;
margin-bottom:10px;
}

.hero p{
font-size:18px;
color:#555;
}

.search{
margin-top:25px;
}

.search input{
width:90%;
max-width:500px;
padding:14px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}.card-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:30px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
text-align:center;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
margin-bottom:10px;
}

.card button{
background:#2563eb;
color:#fff;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
}

footer{
background:#111827;
color:#fff;
text-align:center;
padding:20px;
margin-top:40px;
}
</style>
</head>
